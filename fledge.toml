# fledge.toml — CorvidLabs lifecycle for @corvidlabs/let
# Docs: https://github.com/CorvidLabs/fledge
#
# Single quality gate:
#   fledge lanes run verify

[tasks]
test = "bun install --frozen-lockfile && bun test"
lint = "bunx biome check src/ test/"
build = "bun run build"
format-check = "bunx biome format src/ test/"
doctor = "bun run src/cli.ts doctor --json"
# Library smoke: CLI still loads after build artifacts change
cli-smoke = "bun run src/cli.ts version --json && bun run src/cli.ts doctor --json"

[tasks.spec]
cmd = "fledge spec check"
description = "spec-sync: module specs match tracked source files"

[lanes.verify]
description = "Single CI quality gate: test, lint, build, cli-smoke, specs"
steps = ["test", "lint", "build", "cli-smoke", "spec"]

[lanes.ci]
description = "Alias for verify"
steps = ["test", "lint", "build", "cli-smoke", "spec"]
