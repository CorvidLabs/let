name: Trust

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install hi (Human Intent)
        run: cargo install human-intent --version 0.3.3 --locked

      - name: Human Intent check
        run: hi check

      - name: CorvidLabs Trust gate
        id: trust
        uses: CorvidLabs/trust@fcc889f54d8b4892a81af463c5a0250e2be66fc5 # v1.2.0

      - name: Check managed agent rules
        run: |
          grep -q "CorvidLabs trust toolchain: BEGIN" AGENTS.md
          grep -q "CorvidLabs trust toolchain: END" AGENTS.md
